[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crb"
version = "0.1.0"
description = "me4-rag-bench: plug-and-play Raspberry Pi benchmark for document RAG systems"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
build = ["pyarrow>=14"]
dev = ["pytest>=7"]

[project.scripts]
crb = "crb.cli:main"

[tool.setuptools.packages.find]
include = ["crb*"]

[tool.setuptools.package-data]
crb = ["prompts/*.txt", "report/template.html"]
